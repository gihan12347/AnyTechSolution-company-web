[build]
  command = "npm run build"
  # Leave publish empty when using @netlify/plugin-nextjs (do not set to ".next" in Netlify UI)

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve Decap CMS admin as a static page
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
